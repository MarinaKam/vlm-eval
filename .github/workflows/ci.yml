name: CI

# Lint, format check, and tests on every push to main and every PR.
# The suite is fully offline: backends are mocked (httpx.MockTransport), no
# model weights or dataset are needed — `data/` and `runs/` are gitignored.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv venv --python ${{ matrix.python-version }} && uv pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: uv run ruff check vlm_eval tests scripts

      - name: Format check (ruff format --check)
        run: uv run ruff format --check vlm_eval tests scripts

      - name: Test (pytest)
        run: uv run pytest -q --tb=short
