[project]
name = "vlm-eval"
version = "0.1.0"
description = "Evaluate self-hosted open-weight vision-language models against a production Gemini CV pipeline"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
    # Scoring cached embeddings, fitting thresholds and rendering the reports are all array work and
    # nothing more. Keeping numpy in the base install means that whole half of the encoder path runs
    # without torch: only `embed`, which actually executes a model, needs the heavy extra.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# transformers backends (Florence-2, PaliGemma 2) — install on the GPU box (or Mac for smoke)
hf = ["torch", "torchvision", "transformers>=4.45", "accelerate", "einops", "timm", "numpy<2",
      "sentencepiece", "protobuf", "safetensors"]

[project.scripts]
vlm-eval = "vlm_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vlm_eval"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PERF", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
