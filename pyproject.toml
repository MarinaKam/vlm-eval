[project]
name = "vlm-eval"
version = "0.1.0"
description = "Evaluate self-hosted open-weight vision-language models against a production Gemini CV pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# transformers backends (Florence-2, PaliGemma 2) — install on the GPU box (or Mac for smoke)
hf = ["torch", "torchvision", "transformers>=4.45", "accelerate", "einops", "timm", "numpy<2"]

[project.scripts]
vlm-eval = "vlm_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vlm_eval"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
